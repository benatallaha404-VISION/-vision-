<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب | متجرك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">متجرك</a>
            <div class="nav-links">
                <a href="index.html">الرئيسية</a>
                <a href="checkout.html" class="active">السلة</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="checkout-section">
            <h1>إتمام الطلب</h1>
            
            <div class="checkout-grid">
                <!-- السلة -->
                <div class="checkout-cart">
                    <h2>منتجاتك</h2>
                    <div id="cartItems">
                        <!-- تُعرض ديناميكياً -->
                    </div>
                    <div class="cart-summary">
                        <div class="summary-row">
                            <span>المجموع</span>
                            <span id="subtotal">0 ريال</span>
                        </div>
                        <div class="summary-row">
                            <span>الشحن</span>
                            <span>مجاني</span>
                        </div>
                        <div class="summary-row total">
                            <span>الإجمالي</span>
                            <span id="totalPrice">0 ريال</span>
                        </div>
                    </div>
                </div>

                <!-- نموذج الطلب -->
                <div class="checkout-form">
                    <h2>معلومات التوصيل</h2>
                    <form id="checkoutForm" onsubmit="handleCheckout(event)">
                        <div class="form-group">
                            <label>الاسم الكامل *</label>
                            <input type="text" id="customerName" required placeholder="محمد أحمد">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>رقم الجوال *</label>
                                <input type="tel" id="customerPhone" required placeholder="05xxxxxxxx">
                            </div>
                            <div class="form-group">
                                <label>البريد الإلكتروني *</label>
                                <input type="email" id="customerEmail" required placeholder="example@email.com">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>المدينة *</label>
                            <input type="text" id="customerCity" required placeholder="الرياض">
                        </div>
                        <div class="form-group">
                            <label>العنوان التفصيلي *</label>
                            <textarea id="customerAddress" rows="3" required placeholder="حي... شارع... رقم البناء..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>ملاحظات إضافية</label>
                            <textarea id="orderNotes" rows="2" placeholder="أي ملاحظات خاصة بالطلب..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block" id="submitOrder">
                            تأكيد الطلب
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>متجرك © 2026</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        // تهيئة EmailJS - استبدل بمفاتيحك
        emailjs.init("YOUR_PUBLIC_KEY");

        document.addEventListener('DOMContentLoaded', () => {
            displayCart();
            updateCartCount();
        });
    </script>
</body>
</html>

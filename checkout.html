<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>
<body>
  <div class="container checkout-wrap">
    <a href="index.html" class="back-link">← Back to store</a>
    <h1>Checkout</h1>
    <div id="checkoutProductInfo"></div>
    <form id="checkoutForm">
      <div class="form-row">
        <div class="form-group"><label>Full Name *</label><input type="text" id="fullName" required /></div>
        <div class="form-group"><label>Phone *</label><input type="tel" id="phone" required /></div>
      </div>
      <div class="form-group"><label>Email</label><input type="email" id="email" /></div>
      <div class="form-row">
        <div class="form-group"><label>Order Type</label><select id="orderType"><option value="buy">Buy</option><option value="rent">Rent</option></select></div>
        <div class="form-group"><label>State *</label><select id="state" required><option value="">Select state</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Delivery Method</label><select id="deliveryMethod"><option value="home">Home delivery</option><option value="shipping">Shipping company</option></select></div>
        <div class="form-group"><label>Payment Method</label><select id="paymentMethod"><option value="cash">Cash on delivery</option><option value="card">Bank card</option><option value="ccp">CCP</option></select></div>
      </div>
      <div class="form-group"><label>Address *</label><input type="text" id="address" required /></div>
      <div class="form-group"><label>Additional Note</label><textarea id="note"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Transaction Number</label><input type="text" id="transactionNumber" /></div>
        <div class="form-group"><label>Coupon Code</label><input type="text" id="couponCode" /></div>
      </div>
      <button type="submit" class="submit-btn">Confirm Order</button>
    </form>
    <div id="checkoutResult"></div>
  </div>

  <script src="config.js"></script>
  <script src="checkout.js"></script>
</body>
</html>

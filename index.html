<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجرك | الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">متجرك</a>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن منتج..." onkeyup="searchProducts()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                </svg>
            </div>
            <div class="nav-links">
                <a href="index.html" class="active">الرئيسية</a>
                <a href="checkout.html" class="cart-link">
                    السلة
                    <span class="cart-count" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main>
        <section class="slider-section" id="sliderSection">
            <div class="slider-container" id="sliderContainer"></div>
            <div class="slider-dots" id="sliderDots"></div>
        </section>

        <section class="container products-section">
            <div class="section-header">
                <h2>جميع المنتجات</h2>
                <p id="productsCount">جاري التحميل...</p>
            </div>
            <div class="products-grid" id="productsGrid"></div>
            <div class="empty-state" id="emptyState" style="display:none;">
                <p>لا توجد منتجات حالياً</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
            <p>متجرك © 2026 - جميع الحقوق محفوظة</p>
            <a href="login.html" style="color:var(--text-muted);text-decoration:none;font-size:0.85rem;transition:var(--transition);">🔒 إدارة المتجر</a>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initFirebase();
            loadTheme();
            renderSlider();
            displayProducts();
            updateCartCount();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج | متجرك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">متجرك</a>
            <div class="nav-links">
                <a href="index.html">الرئيسية</a>
                <a href="checkout.html" class="cart-link">السلة <span class="cart-count" id="cartCount">0</span></a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="product-detail" id="productDetail"></div>
    </main>

    <footer class="footer">
        <div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
            <p>متجرك © 2026</p>
            <a href="login.html" style="color:var(--text-muted);text-decoration:none;font-size:0.85rem;">🔒 إدارة المتجر</a>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initFirebase();
            loadTheme();
            displayProductDetail();
            updateCartCount();
        });
    </script>
</body>
</html>

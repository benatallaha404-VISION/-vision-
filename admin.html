<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css" />

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="side-menu">
      <h2 style="color:white;text-align:center;">📊 Dashboard</h2>
      <button class="menu-btn active" data-target="panel-design">🎨 Design</button>
      <button class="menu-btn" data-target="panel-products">📦 Products</button>
      <button class="menu-btn" data-target="panel-categories">📂 Categories</button>
      <button class="menu-btn" data-target="panel-slider">🖼️ Slider</button>
      <button class="menu-btn" data-target="panel-orders">📋 Orders</button>
      <button class="menu-btn" data-target="panel-profits">💰 Profits</button>
      <button class="menu-btn" data-target="panel-coupons">🏷️ Coupons</button>
      <button class="menu-btn" data-target="panel-shipping">🚚 Shipping</button>
      <button class="menu-btn" data-target="panel-comments">💬 Comments</button>
      <button class="menu-btn" data-target="panel-settings">⚙️ Settings</button>
      <hr style="border-color:#333;margin:20px 0;">
      <a href="index.html" style="color:white;text-decoration:none;display:block;text-align:center;">← Back to Store</a>
    </aside>

    <main class="admin-content">
      <!-- Design Panel -->
      <section id="panel-design" class="admin-panel active">
        <h1>🎨 Design Settings</h1>
        <div class="form-group">
          <label>Store Name</label>
          <input type="text" id="storeNameInput" placeholder="Store name" />
        </div>
        <div class="form-group">
          <label>Nickname</label>
          <input type="text" id="nicknameInput" placeholder="Nickname" />
        </div>
        <div class="form-group">
          <label>Brand Identity</label>
          <input type="text" id="brandIdentityInput" placeholder="Brand identity" />
        </div>
        <div class="form-group">
          <label>Primary Color</label>
          <input type="color" id="primaryColorInput" />
        </div>
        <div class="form-group">
          <label>Secondary Color</label>
          <input type="color" id="secondaryColorInput" />
        </div>
        <div class="form-group">
          <label>Accent Color</label>
          <input type="color" id="accentColorInput" />
        </div>
        <div class="form-group">
          <label>Logo URL</label>
          <input type="text" id="logoUrlInput" placeholder="Logo URL" />
        </div>
        <div class="form-group">
          <label>Footer Text</label>
          <textarea id="footerTextInput" placeholder="Footer text"></textarea>
        </div>
        <button id="saveDesignBtn" class="save-btn">💾 Save Design</button>
        <div id="designMessage" class="message"></div>
      </section>

      <!-- Products Panel -->
      <section id="panel-products" class="admin-panel">
        <h1>📦 Products</h1>
        <form id="productForm" class="admin-form">
          <div class="form-group">
            <label>Product Name *</label>
            <input type="text" id="productName" placeholder="Product name" required />
          </div>
          <div class="form-group">
            <label>Description *</label>
            <textarea id="productDescription" placeholder="Product description" required></textarea>
          </div>
          <div class="form-group">
            <label>Images</label>
            <input type="file" id="productImages" accept="image/*" multiple />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Price *</label>
              <input type="number" id="productPrice" placeholder="Price" required />
            </div>
            <div class="form-group">
              <label>Before Discount</label>
              <input type="number" id="productBeforeDiscount" placeholder="Before discount" />
            </div>
            <div class="form-group">
              <label>After Discount</label>
              <input type="number" id="productAfterDiscount" placeholder="After discount" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Discount %</label>
              <input type="number" id="productDiscountPercent" placeholder="Discount percent" />
            </div>
            <div class="form-group">
              <label>Mode *</label>
              <select id="productMode" required>
                <option value="buy">Buy</option>
                <option value="rent">Rent</option>
              </select>
            </div>
            <div class="form-group">
              <label>Stock</label>
              <input type="number" id="productStock" placeholder="Stock" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Sizes</label>
              <input type="text" id="productSizes" placeholder="Sizes (comma separated)" />
            </div>
            <div class="form-group">
              <label>Colors</label>
              <input type="text" id="productColors" placeholder="Colors (comma separated)" />
            </div>
            <div class="form-group">
              <label>Category</label>
              <select id="productCategory">
                <option value="">Select category</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label><input type="checkbox" id="isBestSeller" /> Best seller</label>
            </div>
            <div class="form-group">
              <label><input type="checkbox" id="isSpecialOffer" /> Special offer</label>
            </div>
          </div>
          <button type="submit" class="save-btn">💾 Save Product</button>
        </form>
        <div id="productMessage" class="message"></div>
        <h2>Product List</h2>
        <div id="productsAdminList" class="products-grid"></div>
      </section>

      <!-- Categories Panel -->
      <section id="panel-categories" class="admin-panel">
        <h1>📂 Categories</h1>
        <div class="form-row">
          <div class="form-group">
            <input type="text" id="categoryName" placeholder="Category name" />
          </div>
          <div class="form-group">
            <button id="addCategoryBtn" class="save-btn">➕ Add Category</button>
          </div>
        </div>
        <div id="categoryMessage" class="message"></div>
        <div id="categoriesAdminList" class="categories-grid"></div>
      </section>

      <!-- Slider Panel - WITH IMAGE UPLOAD -->
      <section id="panel-slider" class="admin-panel">
        <h1>🖼️ Slider</h1>
        <div class="form-group">
          <label>Slide Title *</label>
          <input type="text" id="slideTitle" placeholder="Slide title" />
        </div>
        <div class="form-group">
          <label>Slide Text *</label>
          <textarea id="slideText" placeholder="Slide text"></textarea>
        </div>
        <div class="form-group">
          <label>Upload Image</label>
          <input type="file" id="slideImageFile" accept="image/*" />
          <p class="small-note">Or enter image URL below</p>
        </div>
        <div class="form-group">
          <label>Image URL (optional)</label>
          <input type="text" id="slideImage" placeholder="Slide image URL" />
        </div>
        <button id="addSlideBtn" class="save-btn">➕ Add Slide</button>
        <div id="slideMessage" class="message"></div>
        <div id="slidesAdminList"></div>
      </section>

      <!-- Orders Panel -->
      <section id="panel-orders" class="admin-panel">
        <h1>📋 Orders</h1>
        <div id="orderMessage" class="message"></div>
        <div id="ordersAdminList" class="orders-grid"></div>
      </section>

      <!-- Profits Panel -->
      <section id="panel-profits" class="admin-panel">
        <h1>💰 Monthly Profits</h1>
        <div id="monthlyProfits"></div>
      </section>

      <!-- Coupons Panel -->
      <section id="panel-coupons" class="admin-panel">
        <h1>🏷️ Coupons</h1>
        <div class="form-row">
          <div class="form-group">
            <input type="text" id="couponName" placeholder="Coupon code" />
          </div>
          <div class="form-group">
            <input type="number" id="couponValue" placeholder="Discount value" />
          </div>
          <div class="form-group">
            <button id="addCouponBtn" class="save-btn">➕ Add Coupon</button>
          </div>
        </div>
        <div id="couponMessage" class="message"></div>
        <div id="couponsAdminList" class="coupons-grid"></div>
      </section>

      <!-- Shipping Panel -->
      <section id="panel-shipping" class="admin-panel">
        <h1>🚚 Shipping</h1>
        <div class="form-row">
          <div class="form-group">
            <input type="text" id="shippingState" placeholder="State" />
          </div>
          <div class="form-group">
            <input type="number" id="shippingPrice" placeholder="Shipping price" />
          </div>
          <div class="form-group">
            <label><input type="checkbox" id="shippingFree" /> Free shipping</label>
          </div>
          <div class="form-group">
            <button id="saveShippingBtn" class="save-btn">💾 Save Shipping</button>
          </div>
        </div>
        <div id="shippingMessage" class="message"></div>
        <div id="shippingAdminList" class="shipping-grid"></div>
      </section>

      <!-- Comments Panel -->
      <section id="panel-comments" class="admin-panel">
        <h1>💬 Comments</h1>
        <div id="commentsAdminList" class="comments-grid"></div>
      </section>

      <!-- Settings Panel -->
      <section id="panel-settings" class="admin-panel">
        <h1>⚙️ Integration Settings</h1>
        <div class="form-group">
          <label>Firebase Config</label>
          <textarea id="firebaseConfigBox" placeholder="Firebase config"></textarea>
        </div>
        <div class="form-group">
          <label>EmailJS Config</label>
          <textarea id="emailjsConfigBox" placeholder="EmailJS config"></textarea>
        </div>
        <div class="form-group">
          <label>Google Sheets URL</label>
          <textarea id="googleSheetsBox" placeholder="Google Sheets URL"></textarea>
        </div>
        <button id="saveIntegrationBtn" class="save-btn">💾 Save Settings</button>
        <div id="settingsMessage" class="message"></div>
        <p class="small-note">Paste your settings here if you want to edit them later.</p>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>

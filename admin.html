<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | المشرف</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>لوحة التحكم</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="#dashboard" class="active"><span>📊</span> لوحة المعلومات</a>
            <a href="#products"><span>📦</span> المنتجات</a>
            <a href="#orders"><span>🛒</span> الطلبات</a>
            <a href="#profits"><span>💰</span> الأرباح</a>
            <a href="#banners"><span>🖼️</span> البانر</a>
            <a href="#settings"><span>⚙️</span> الإعدادات</a>
        </nav>
    </aside>
    <main class="admin-main">
        <!-- المحتوى يتغير حسب القسم -->
    </main>
</div>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">متجرك</a>
            <div class="nav-links">
                <a href="index.html">الرئيسية</a>
                <a href="admin.html" class="active">لوحة التحكم</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="admin-section">
            <div class="admin-header">
                <h1>لوحة التحكم</h1>
                <p>إدارة المنتجات والطلبات</p>
            </div>

            <!-- نموذج إضافة منتج -->
            <div class="admin-card">
                <h2>إضافة / تعديل منتج</h2>
                <form id="productForm" onsubmit="handleProductSubmit(event)">
                    <input type="hidden" id="productId">
                    <div class="form-row">
                        <div class="form-group">
                            <label>اسم المنتج</label>
                            <input type="text" id="productName" required placeholder="مثال: ساعة يد فاخرة">
                        </div>
                        <div class="form-group">
                            <label>السعر (ريال)</label>
                            <input type="number" id="productPrice" required min="0" step="0.01" placeholder="199.00">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>الفئة</label>
                            <input type="text" id="productCategory" placeholder="مثال: إلكترونيات">
                        </div>
                        <div class="form-group">
                            <label>الكمية المتوفرة</label>
                            <input type="number" id="productStock" min="0" value="10">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>رابط الصورة</label>
                        <input type="url" id="productImage" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="form-group">
                        <label>وصف المنتج</label>
                        <textarea id="productDesc" rows="3" placeholder="وصف تفصيلي للمنتج..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submitBtn">إضافة المنتج</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()" id="cancelBtn" style="display:none;">إلغاء</button>
                    </div>
                </form>
            </div>

            <!-- جدول المنتجات -->
            <div class="admin-card">
                <div class="card-header">
                    <h2>المنتجات المخزنة</h2>
                    <span class="badge" id="totalProducts">0 منتج</span>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>الصورة</th>
                                <th>الاسم</th>
                                <th>السعر</th>
                                <th>الكمية</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="productsTable">
                            <!-- الصفوف تُعرض هنا -->
                        </tbody>
                    </table>
                </div>
                <div class="empty-state" id="adminEmptyState" style="display:none;">
                    <p>لا توجد منتجات بعد</p>
                </div>
            </div>

            <!-- إعدادات الألوان -->
            <div class="admin-card">
                <h2>تخصيص الألوان</h2>
                <div class="color-settings">
                    <div class="form-group">
                        <label>لون الخلفية الرئيسي</label>
                        <input type="color" id="bgColor" value="#0a0a0a" onchange="updateTheme()">
                    </div>
                    <div class="form-group">
                        <label>لون النص الرئيسي</label>
                        <input type="color" id="textColor" value="#ffffff" onchange="updateTheme()">
                    </div>
                    <div class="form-group">
                        <label>لون الأزرار</label>
                        <input type="color" id="btnColor" value="#ffffff" onchange="updateTheme()">
                    </div>
                    <button class="btn btn-secondary" onclick="resetTheme()">إعادة الافتراضي</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>لوحة التحكم © 2026</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadAdminProducts();
            loadThemeSettings();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المشرف | متجرك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-error {
            background: rgba(255,51,51,0.1);
            border-right: 3px solid var(--danger);
            color: var(--danger);
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        .login-error.show { display: block; }
        .login-success {
            background: rgba(0,204,102,0.1);
            border-right: 3px solid var(--success);
            color: var(--success);
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        .login-success.show { display: block; }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <h1>🔒 تسجيل دخول المشرف</h1>
            <p>أدخل بياناتك للوصول إلى لوحة التحكم</p>
            
            <div class="login-error" id="loginError"></div>
            <div class="login-success" id="loginSuccess"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" required placeholder="admin@matjark.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">دخول</button>
            </form>
            <a href="index.html" class="back-link">← العودة للموقع</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ⚠️ استبدل هذين بقيم مشروعك
        const SUPABASE_URL = "https://jeixaxbcqytzbdsksdol.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Awnjggbx9XZUWulYBtfLyg__WYkbPje"; // ← ضع مفتاحك هنا

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorEl = document.getElementById('loginError');
        const successEl = document.getElementById('loginSuccess');

        // إذا كان مسجل دخوله مسبقاً، أنقله للداشبورد
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                window.location.replace('admin.html');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            errorEl.classList.remove('show');
            successEl.classList.remove('show');
            loginBtn.disabled = true;
            loginBtn.textContent = 'جاري الدخول...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    throw error;
                }

                // ✅ نجاح! انتظر قليلاً ثم انقله
                successEl.textContent = 'تم تسجيل الدخول بنجاح... جاري التحويل';
                successEl.classList.add('show');
                
                setTimeout(() => {
                    window.location.replace('admin.html');
                }, 500);

            } catch (err) {
                console.error('Login error:', err);
                let msg = 'خطأ في البريد أو كلمة المرور';
                
                if (err.message.includes('Invalid login')) msg = 'البريد أو كلمة المرور خاطئة';
                else if (err.message.includes('Email not confirmed')) msg = 'يرجى تأكيد البريد الإلكتروني أولاً';
                else if (err.message.includes('rate limit')) msg = 'محاولات كثيرة، حاول بعد دقيقة';
                
                errorEl.textContent = msg;
                errorEl.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.textContent = 'دخول';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المشرف | متجرك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-error { background: rgba(255,51,51,0.1); border-right: 3px solid var(--danger); color: var(--danger); padding: 12px 16px; margin-bottom: 20px; font-size: 0.9rem; display: none; }
        .login-error.show { display: block; }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <h1>🔒 تسجيل دخول المشرف</h1>
            <p>أدخل كلمة المرور للوصول إلى لوحة التحكم</p>
            <div class="login-error" id="loginError"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" required placeholder="admin@matjark.com" value="admin@matjark.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">دخول</button>
            </form>
            <a href="index.html" class="back-link">← العودة للموقع</a>
        </div>
    </div>

    <script>
        // ✅ كلمة سر ثابتة - غيّرها كما تحب
        const ADMIN_PASSWORD = "admin123";

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorEl = document.getElementById('loginError');

        // إذا كان مسجل دخوله، انقله مباشرة
        if (sessionStorage.getItem('admin_logged_in') === 'true') {
            window.location.replace('admin.html');
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const password = document.getElementById('loginPassword').value;
            const email = document.getElementById('loginEmail').value;

            loginBtn.disabled = true;
            loginBtn.textContent = 'جاري الدخول...';
            errorEl.classList.remove('show');

            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('admin_logged_in', 'true');
                sessionStorage.setItem('admin_email', email);
                window.location.replace('admin.html');
            } else {
                errorEl.textContent = 'كلمة المرور خاطئة';
                errorEl.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.textContent = 'دخول';
            }
        });
    </script>
</body>
</html>

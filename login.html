<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المشرف | متجرك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-error {
            background: rgba(255,51,51,0.1);
            border-right: 3px solid var(--danger);
            color: var(--danger);
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        .login-error.show { display: block; }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <h1>🔒 تسجيل دخول المشرف</h1>
            <p>أدخل بياناتك للوصول إلى لوحة التحكم</p>
            
            <div class="login-error" id="loginError"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" required placeholder="admin@matjark.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">دخول</button>
            </form>
            <a href="index.html" class="back-link">← العودة للموقع</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // تحقق من تهيئة Firebase
            try {
                initFirebase();
                if (typeof auth === 'undefined' || !auth) {
                    showLoginError('⚠️ خطأ في إعدادات Firebase. تأكد من ملء apiKey و projectId في app.js');
                    return;
                }
            } catch (err) {
                showLoginError('⚠️ فشل تهيئة Firebase: ' + err.message);
                console.error(err);
                return;
            }

            // إذا كان مسجل دخوله مسبقاً، أنقله للداشبورد
            auth.onAuthStateChanged(user => {
                if (user) {
                    window.location.replace('admin.html');
                }
            });

            // ربط النموذج
            document.getElementById('loginForm').addEventListener('submit', loginAdmin);
        });

        function showLoginError(msg) {
            const el = document.getElementById('loginError');
            el.textContent = msg;
            el.classList.add('show');
        }

        function loginAdmin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');

            if (!email || !password) {
                showLoginError('يرجى ملء جميع الحقول');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'جاري الدخول...';
            errorEl.classList.remove('show');

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    window.location.replace('admin.html');
                })
                .catch(err => {
                    console.error('Login error:', err);
                    let msg = 'خطأ في البريد أو كلمة المرور';
                    if (err.code === 'auth/invalid-api-key') msg = '⚠️ مفتاح Firebase API غير صحيح. عدّل app.js';
                    else if (err.code === 'auth/user-not-found') msg = 'هذا البريد غير مسجل';
                    else if (err.code === 'auth/wrong-password') msg = 'كلمة المرور خاطئة';
                    else if (err.code === 'auth/invalid-email') msg = 'البريد الإلكتروني غير صالح';
                    else if (err.code === 'auth/too-many-requests') msg = 'تم حظر المحاولات مؤقتاً، حاول لاحقاً';
                    else if (err.code === 'auth/network-request-failed') msg = 'مشكلة في الاتصال بالإنترنت';
                    
                    showLoginError(msg);
                    btn.disabled = false;
                    btn.textContent = 'دخول';
                });
        }
    </script>
</body>
</html>
